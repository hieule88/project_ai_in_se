<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 Z" fill="#334155"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="750" fill="#ffffff"/>

  <text x="550" y="34" text-anchor="middle" font-size="21" font-weight="800" fill="#1f2937">Kiến trúc tổng quan — WebGen</text>

  <!-- ===== LỚP 1: GIAO DIỆN ===== -->
  <rect x="40" y="56" width="1020" height="152" rx="16" fill="#eef4ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="70" y="86" font-size="13.5" font-weight="800" fill="#3b5bdb">NGƯỜI DÙNG · GIAO DIỆN  (React + Vite + Tailwind)</text>
  <g>
    <rect x="70"  y="100" width="222" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="316" y="100" width="222" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="562" y="100" width="222" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="808" y="100" width="222" height="92" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle">
    <text x="181" y="142" font-size="15" font-weight="700" fill="#1f2937">Chat</text>
    <text x="181" y="162" font-size="11.5" fill="#6b7280">mô tả &amp; chỉnh sửa</text>
    <text x="427" y="142" font-size="15" font-weight="700" fill="#1f2937">Preview</text>
    <text x="427" y="162" font-size="11.5" fill="#6b7280">iframe cục bộ</text>
    <text x="673" y="142" font-size="15" font-weight="700" fill="#1f2937">Soạn mã</text>
    <text x="673" y="162" font-size="11.5" fill="#6b7280">Monaco editor</text>
    <text x="919" y="142" font-size="15" font-weight="700" fill="#1f2937">Brand &amp; Kho RAG</text>
    <text x="919" y="162" font-size="11.5" fill="#6b7280">quản lý (CRUD)</text>
  </g>

  <!-- arrows FE <-> BE -->
  <line x1="505" y1="208" x2="505" y2="284" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="595" y1="286" x2="595" y2="210" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="498" y="252" text-anchor="end" font-size="11.5" fill="#475569">gửi yêu cầu</text>
  <text x="602" y="252" text-anchor="start" font-size="11.5" fill="#475569">nhận website</text>
  <text x="550" y="268" text-anchor="middle" font-size="10.5" fill="#94a3b8">HTTP</text>

  <!-- ===== LỚP 2: MÁY CHỦ ===== -->
  <rect x="40" y="288" width="1020" height="236" rx="16" fill="#fffdf3" stroke="#ecd98a" stroke-width="1.5"/>
  <text x="70" y="318" font-size="13.5" font-weight="800" fill="#8a7400">MÁY CHỦ · Node + Express</text>

  <rect x="70" y="330" width="960" height="66" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="1.5"/>
  <text x="550" y="364" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1f2937">Lớp API   →   QUY TRÌNH ĐA TÁC TỬ  ·  Reflection  (Mục 2.2)</text>

  <rect x="70"  y="414" width="460" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="570" y="414" width="460" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <g text-anchor="middle">
    <text x="300" y="448" font-size="15" font-weight="700" fill="#1f2937">CODE RAG</text>
    <text x="300" y="468" font-size="11.5" fill="#6b7280">embedding cục bộ + vector store (cosine)</text>
    <text x="800" y="448" font-size="15" font-weight="700" fill="#1f2937">LỚP GỌI MÔ HÌNH</text>
    <text x="800" y="468" font-size="11.5" fill="#6b7280">trung lập nhà cung cấp (Mục 2.3)</text>
  </g>

  <!-- arrows BE -> external -->
  <line x1="300" y1="494" x2="300" y2="636" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="312" y="572" text-anchor="start" font-size="11.5" fill="#475569">truy xuất component</text>
  <line x1="800" y1="494" x2="800" y2="636" stroke="#334155" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="812" y="572" text-anchor="start" font-size="11.5" fill="#475569">sinh / sửa mã</text>

  <!-- ===== LỚP 3: DỊCH VỤ NGOÀI ===== -->
  <rect x="40" y="600" width="1020" height="122" rx="16" fill="#f5f5f7" stroke="#d6d6db" stroke-width="1.5"/>
  <text x="70" y="628" font-size="13.5" font-weight="800" fill="#555555">DỊCH VỤ NGOÀI  (tách rời để dễ thay thế)</text>
  <rect x="70"  y="640" width="460" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="570" y="640" width="460" height="64" rx="12" fill="#1f2937"/>
  <g text-anchor="middle">
    <text x="300" y="668" font-size="14.5" font-weight="700" fill="#1f2937">KHO TRI THỨC COMPONENT</text>
    <text x="300" y="687" font-size="11.5" fill="#6b7280">design-system DBEE</text>
    <text x="800" y="668" font-size="14.5" font-weight="700" fill="#f2db45">MÔ HÌNH NGÔN NGỮ (LLM)</text>
    <text x="800" y="687" font-size="11.5" fill="#cbd5e1">open-weight · Qwen3-Coder-Next</text>
  </g>
</svg>
