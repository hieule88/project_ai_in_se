<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ahB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#1f2937"/></marker>
    <marker id="ahR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="ahG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="700" fill="#ffffff"/>

  <!-- Reflection container -->
  <rect x="70" y="200" width="700" height="300" rx="14" fill="#fffdf3" stroke="#d4bf3a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="420" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#8a7400">VÒNG LẶP REFLECTION</text>

  <!-- Nodes -->
  <g stroke="#1f2937" stroke-width="1.6">
    <rect x="150" y="16"  width="130" height="48" rx="10" fill="#ffffff"/>
    <rect x="110" y="98"  width="210" height="60" rx="10" fill="#ffffff"/>
    <rect x="140" y="262" width="150" height="76" rx="10" fill="#ffffff"/>
    <rect x="470" y="262" width="150" height="76" rx="10" fill="#ffffff"/>
    <rect x="510" y="544" width="160" height="62" rx="10" fill="#ffffff"/>
    <rect x="745" y="551" width="110" height="48" rx="10" fill="#1f2937"/>
  </g>

  <!-- Node labels -->
  <g text-anchor="middle" fill="#1f2937">
    <text x="215" y="46"  font-size="16" font-weight="600">Mô tả</text>

    <text x="215" y="124" font-size="16" font-weight="600">Truy xuất</text>
    <text x="215" y="143" font-size="16" font-weight="600">component</text>
    <text x="332" y="133" text-anchor="start" font-size="13" fill="#6b7280">◀─ RAG Agent</text>

    <text x="215" y="297" font-size="16" font-weight="600">Sinh mã</text>
    <text x="215" y="316" font-size="13" fill="#6b7280">(Coder)</text>

    <text x="545" y="297" font-size="16" font-weight="600">Phản biện</text>
    <text x="545" y="316" font-size="13" fill="#6b7280">(Critic)</text>

    <text x="590" y="572" font-size="16" font-weight="600">Hoàn thiện</text>
    <text x="590" y="591" font-size="12" fill="#6b7280">chèn logo</text>

    <text x="800" y="581" font-size="16" font-weight="700" fill="#ffffff">website</text>
  </g>

  <!-- Vertical chain: Mô tả -> Truy xuất -> Coder -->
  <g stroke="#1f2937" stroke-width="1.8" fill="none">
    <line x1="215" y1="64"  x2="215" y2="94"  marker-end="url(#ahB)"/>
    <line x1="215" y1="158" x2="215" y2="258" marker-end="url(#ahB)"/>
  </g>

  <!-- Coder -> Critic (forward) -->
  <line x1="290" y1="296" x2="466" y2="296" stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#ahB)"/>
  <text x="378" y="287" text-anchor="middle" font-size="12" fill="#374151">bản nháp / bản sửa</text>

  <!-- Critic -> Coder (loop back: CHƯA ĐẠT) -->
  <path d="M490,338 V392 H215 V342" stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#ahR)"/>
  <text x="360" y="414" text-anchor="middle" font-size="12.5" fill="#c0392b" font-weight="600">CHƯA ĐẠT: phản hồi (lỗi + gợi ý sửa)</text>

  <!-- ĐẠT: thoát xuống dưới -->
  <line x1="590" y1="338" x2="590" y2="540" stroke="#2e7d32" stroke-width="2" fill="none" marker-end="url(#ahG)"/>
  <text x="612" y="366" text-anchor="start" font-size="13" fill="#2e7d32" font-weight="700">ĐẠT</text>

  <!-- Hoàn thiện -> website -->
  <line x1="670" y1="575" x2="741" y2="575" stroke="#1f2937" stroke-width="1.8" fill="none" marker-end="url(#ahB)"/>

  <!-- note -->
  <text x="420" y="658" text-anchor="middle" font-size="12.5" fill="#6b7280">ĐẠT = Critic chấp nhận + công cụ kiểm tra sạch lỗi (hoặc hết số vòng) → giữ phiên bản tốt nhất</text>
</svg>
